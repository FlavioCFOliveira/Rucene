[package]
name = "kgsync"
version = "0.1.0"
edition = "2021"
description = "Fast differential synchronisation of the Rucene knowledge graph (rmp graph)."
license = "MIT"
publish = false

# Standalone: not a member of the Rucene workspace.
[workspace]

[dependencies]
syn = { version = "=2.0.119", features = ["full", "visit", "parsing", "printing"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
rayon = "=1.12.0"
mimalloc = { version = "=0.1.52", default-features = false }
rustc-hash = "=2.1.3"
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

[profile.release]
opt-level = 3
debug = false
codegen-units = 16
