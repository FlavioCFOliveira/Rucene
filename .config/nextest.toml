| (binary_id(=rucene::portability_scalar_quantized_vectors) & test(=scalar_quantized_vectors_match_lucene_byte_for_byte))
| (binary_id(=rucene::portability_similarity_scores) & test(=similarity_scores_and_explanations_match_lucene))
'''
