# cargo-nextest configuration for Rucene (sprint 7, 2026-11-12).
#
# One process per test, run in parallel across the whole workspace. Every test
# process goes through the target runner `rucene-mem-runner`, which places it in
# `rucene-tests.slice` (aggregate MemoryMax 14G, MemoryHigh 13G) with a
# per-process cap, so the parallelism below can never take the machine out of
# memory: a runaway test is killed inside the slice, never the session.
#
# Run:  tools/test/run_suite.sh <out-dir>   (wraps everything below, with the
#       stall watchdog tools/test/stall_watchdog.py)
#       cargo nextest run --workspace --exclude randomizedtesting --no-fail-fast
#       cargo test -p randomizedtesting   (its two harness=false targets cannot
#                                          be listed by nextest)
# The Java harness (tests/fixtures/java-codec-harness) needs no preparation:
# the test helper tests/jvm_fixture compiles it and resolves its class path once,
# under a cross-process file lock, and again only when pom.xml or src/ change.

[profile.default]
# 16 CPUs: leave headroom for the session, rust-analyzer and the JVMs the
# oracle tests start.
test-threads = 12
fail-fast = false
# A test silent for 2 minutes is reported; after 15 such periods (30 min) it is
# killed and counted as a failure instead of stalling the run.
slow-timeout = { period = "120s", terminate-after = 15 }
status-level = "fail"
final-status-level = "slow"

# The randomized fuzz targets: long byte sweeps, so a longer slow period. Each
# takes one slot, like every other test: measured over the 66 `fuzz_*` tests
# (rmp #604, 2026-11-20), peak RSS at most 46 MB and CPU/wall at most 1.0, so
# reserving four slots each (rmp #606 W3) only left slots idle.
[[profile.default.overrides]]
filter = 'binary(/^fuzz_/)'
slow-timeout = { period = "300s", terminate-after = 12 }

# Scheduling (rmp #608 R4): nextest starts higher `priority` tests sooner
# (range -100..100, default 0). The suite is slot-bound, so a long test that
# starts late extends the span. Walls are those of the cycle-1 validation run
# (`.rucene-perf/test-cycles/cycle1-validate/per_test_costs.csv`); the tests the
# oracle helper's `DisableFsyncFS` shortened (R1) are ranked by their walls
# after it. Scheduling only: no test changes what it runs.
# Tests of 30 s or more wall (7 tests).
[[profile.default.overrides]]
filter = '''
(binary_id(=rucene-analysis-common::analysis_email_tests) & test(=test_uax29_url_email_tokenizer_nightly))
| (binary_id(=rucene-analysis-common::date_parse_jdk_oracle) & test(=parse_results_equal_jdk_25))
| (binary_id(=rucene-codecs::base_doc_values_format_codecs) & test(=test_simple_text_doc_values_format))
| (binary_id(=rucene::fuzz_doc_values) & test(=every_value_at_every_byte_of_the_data_file_is_survived))
| (binary_id(=rucene::fuzz_norms) & test(=every_value_at_every_byte_of_the_data_file_is_survived))
| (binary_id(=rucene::fuzz_term_vectors) & test(=every_value_at_every_byte_of_the_data_file_is_survived))
| (binary_id(=rucene::indexing_ram) & test(=ram_flushes_cut_lucenes_segments))
'''
priority = 90

