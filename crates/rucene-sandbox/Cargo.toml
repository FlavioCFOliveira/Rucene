[package]
name = "rucene-sandbox"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
authors = ["Flavio CF Oliveira"]
license = "MIT"
description = "Rust port of Apache Lucene 10.5.0 lucene/sandbox, limited to FuzzyLikeThisQuery."
repository = "https://github.com/FlavioCFOliveira/Rucene"
publish = false

[lib]
name = "rucene_sandbox"

# Lucene's `lucene/sandbox` module also requires `lucene/queries` and
# `lucene/facet`; the one file in scope, `FuzzyLikeThisQuery.java`, imports
# `lucene/core` only.
[dependencies]
rucene = { path = "../.." }

[dev-dependencies]
# The tests port Lucene's sandbox test of `FuzzyLikeThisQuery` onto
# lucene/test-framework (and its randomized-testing base); the Java-oracle
# harness they share with `rucene-queries` (rmp #475) draws on both.
rucene-test-framework = { path = "../rucene-test-framework" }
randomizedtesting = { path = "../randomizedtesting" }
