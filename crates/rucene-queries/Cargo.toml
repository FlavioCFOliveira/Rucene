[package]
name = "rucene-queries"
version = "0.2.0"
edition = "2021"
rust-version = "1.100"
authors = ["Flavio CF Oliveira"]
license = "MIT"
description = "Rust port of Apache Lucene 10.5.0 lucene/queries (function queries and value sources, intervals, spans, payload queries, more-like-this)."
repository = "https://github.com/FlavioCFOliveira/Rucene"
publish = false

[lib]
name = "rucene_queries"

[dependencies]
rucene = { path = "../.." }

[dev-dependencies]
# The tests port Lucene's query-module tests onto lucene/test-framework (and
# its randomized-testing base), and the Java-oracle harness of the query
# modules (`tests/query_oracle/`, rmp #475) draws on both.
rucene-test-framework = { path = "../rucene-test-framework" }
randomizedtesting = { path = "../randomizedtesting" }
