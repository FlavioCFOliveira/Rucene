[package]
name = "rucene-analysis-common"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["Flavio CF Oliveira"]
license = "MIT"
description = "Rust port of Apache Lucene 10.5.0 lucene/analysis/common (analyzers, tokenizers, token filters and char filters)."
repository = "https://github.com/FlavioCFOliveira/Rucene"
publish = false

[lib]
name = "rucene_analysis_common"

[dependencies]
rucene = { path = "../.." }
# Inflates the JDK 25 locale data `SimpleDateFormat` parsing reads
# (`src/jdk/date_parse_data.bin`, zlib), the same backend as the core crate.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# The XML pull parser under the SAX-shaped reader `jdk::sax`, which
# `PatternParser` (analysis.compound.hyphenation) reads hyphenation pattern
# files with in place of the JDK's SAX parser (MIT; user decision on rmp task
# #461, 2026-11-13). No features: the reader decodes the bytes itself.
quick-xml = "0.42.0"

[dev-dependencies]
# The tests port Lucene's analysis tests onto lucene/test-framework (and its
# randomized-testing base), and draw the oracle corpus with its generators.
# The test framework depends on this crate in turn: a dev-dependency cycle, as
# `rucene-codecs` has.
rucene-test-framework = { path = "../rucene-test-framework" }
randomizedtesting = { path = "../randomizedtesting" }
