[package]
name = "rucene-benchmark"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["Flavio CF Oliveira"]
license = "MIT"
description = "Rust port of Apache Lucene 10.5.0 lucene/benchmark (byTask algorithms, quality and TREC evaluation)."
repository = "https://github.com/FlavioCFOliveira/Rucene"
publish = false

[lib]
name = "rucene_benchmark"

# Lucene's `lucene/benchmark/build.gradle` also uses commons-compress, icu4j and
# nekohtml (user decisions on rmp #611, 2026-11-22): commons-compress's GZIP and
# BZIP2 streams (`byTask.utils.StreamUtils`) are replaced by `flate2` on the
# workspace's `zlib-rs` backend (the C backend would switch the whole workspace
# through feature unification) and `bzip2` on its default pure-Rust backend
# (declared divergence: written `.gz` and `.bz2` bytes may differ from
# commons-compress; decoding is equal both ways); icu4j's root `%spellout-numbering` rule
# and nekohtml 1.9.17 are ported, not replaced, so neither adds a dependency.
[dependencies]
rucene = { path = "../.." }
rucene-analysis-common = { path = "../rucene-analysis-common" }
rucene-facet = { path = "../rucene-facet" }
rucene-highlighter = { path = "../rucene-highlighter" }
rucene-queries = { path = "../rucene-queries" }
rucene-queryparser = { path = "../rucene-queryparser" }
rucene-spatial-extras = { path = "../rucene-spatial-extras" }
spatial4j = { path = "../spatial4j" }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6.1"
